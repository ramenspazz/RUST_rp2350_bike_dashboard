[package]
name = "rp-2350-i2s-output"
version = "0.0.19128" # Preserved project version.
edition = "2021"

[features]
default = []
test-tone = []

[dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.7"
cortex-m-rtic = "1.1.4" # Retain RTIC 1.x API; RTIC 2 is a migration.
critical-section = "1.2.0"
defmt = "1.2.0"
defmt-rtt = "1.3.1"

# Preserve this deliberate Git pin until its use in the application is reviewed for update.
dht-sensor = { version = "0.2.1", git = "https://github.com/michaelbeaumont/dht-sensor", rev = "10319bdeae9ace3bb0fc79a15da2869c5bf50f52" }

# Retain these API lines; newer breaking releases need a source review for update.
embedded-alloc = "0.5.1"
heapless = "0.8.0"

embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["defmt-03"] }
embedded-io = "0.7.1"
embedded_hal_0_2 = { package = "embedded-hal", version = "0.2.7", features = ["unproven"] }

# Must remain on the HAL's 0.3 API line: duration/rate types cross crate boundaries.
fugit = "0.3.9"
futures = { version = "0.3.34", default-features = false, features = ["async-await"] }
libm = "0.2.16"
mipidsi = "0.10.0"
nb = "1.1.0"
panic-halt = "1.0.0"
# Match the pinned HAL's PIO dependency.
pio = "0.4.0"
static_cell = "2.1.1"
usb-device = { version = "0.3.2", features = ["control-buffer-256"] }
usbd-serial = "0.2.2"

[dependencies.rp235x-hal]
# Retain this revision for RP2350B qfn80 / GPIO40 ADC support.
git = "https://github.com/rp-rs/rp-hal.git"
rev = "2df78708a07825654994662d98777dcab22c051a"
features = [
    "binary-info",
    "critical-section-impl",
    "rt",
    "defmt",
    "qfn80",
]

# Patch update only. Embassy 0.10 requires a separate API/feature migration. Want to eventually update
[target.'cfg(target_arch = "arm")'.dependencies]
embassy-executor = { version = "0.5.1", features = ["arch-cortex-m", "executor-thread"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
embassy-executor = { version = "0.5.1", features = ["arch-riscv32", "executor-thread"] }
